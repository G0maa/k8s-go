apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: mohago/k8s-go-103
          imagePullPolicy: Always
          resources:
            limits:
              memory: "128Mi"
              cpu: "256m"
          env:
            - name: PORT
              value: "3031"